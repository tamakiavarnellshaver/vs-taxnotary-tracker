# Egress allowlist for the agent container.
#
# The agent service has NO direct route to the internet — it sits on an
# internal-only Docker network. The only way out is through this proxy,
# which allows connections to exactly the hosts this project's workflow
# needs and denies everything else with an explicit, logged rejection.
#
# Allowed:
#   - registry.npmjs.org + npm's CDN mirrors  -> npm install
#   - github.com, api.github.com,
#     objects.githubusercontent.com,
#     codeload.github.com                     -> git fetch/push
# Everything else is denied by default.

acl allowed_dst_domains dstdomain .npmjs.org
acl allowed_dst_domains dstdomain .npmjs.com
acl allowed_dst_domains dstdomain registry.npmjs.org
acl allowed_dst_domains dstdomain github.com
acl allowed_dst_domains dstdomain api.github.com
acl allowed_dst_domains dstdomain objects.githubusercontent.com
acl allowed_dst_domains dstdomain codeload.github.com

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow allowed_dst_domains
http_access deny all

http_port 3128

access_log /var/log/squid/access.log squid
cache deny all
